<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:#f9fafb; color:#111827; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
      .card { background:white; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.06); max-width:600px; text-align:center; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>The application is unable to reach the network. Some data may not be available right now.</p>
      <p>Please check your connection and try again.</p>
      <p><a href="/">Reload</a></p>
    </div>
  </body>
</html>
